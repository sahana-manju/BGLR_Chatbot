<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <title>BGLR Code Assistant</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        .container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        /* LEFT SIDE - CHAT */
        .chat-container {
            width: 800px;
        }
        .container {
    display: flex;
    gap: 30px;
}

.chat-container,
.code-container {
    flex: 1;
    min-width: 0;
}

        #chatbox {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
            overflow: auto;
            padding: 10px;
            box-sizing: border-box;
        }
        /* Chat messages */
.chatbox {
    font-family: Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
}

/* Smaller headings inside AI responses */
.chatbox h1 {
    font-size: 20px;
    margin: 12px 0 6px;
}

.chatbox h2 {
    font-size: 18px;
    margin: 10px 0 5px;
}

.chatbox h3 {
    font-size: 16px;
    margin: 8px 0 4px;
}

/* Code blocks */
.chatbox pre {
    background: #f6f8fa;
    border: 1px solid #e1e4e8;
    border-radius: 6px;
    padding: 12px;
    margin: 10px 0;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.45;
}

/* Code inside code blocks */
.chatbox pre code {
    font-family: "Consolas", "Monaco", monospace;
    background: none;
    padding: 0;
    color: #24292f;
}

/* Inline code */
.chatbox :not(pre) > code {
    background: #f1f3f5;
    padding: 2px 5px;
    border-radius: 4px;
    font-family: "Consolas", "Monaco", monospace;
    font-size: 0.9em;
}



        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px;
        }

        .code-block {
            height: 400px;
    overflow: auto;

    background: #1e1e1e;
    color: #d4d4d4;

    border: 1px solid #555;
    border-radius: 8px;
    padding: 16px;
    margin: 12px 0;

    box-sizing: border-box;
}

.code-block code {
    font-family: Consolas, Monaco, monospace;
    white-space: pre;
}


       
    </style>
</head>

<body>

<h2>BGLR Chatbot</h2>


<div class="container">

    <!-- ========================= -->
    <!-- LEFT: CHATBOT -->
    <!-- ========================= -->

    <div class="chat-container">

        <div id="chatbox"></div>

        <br>

        <input
            type="text"
            id="message"
            value="{{message}}"
            placeholder="Ask anything about BGLR"
        >

        <br><br>

        <button onclick="sendMessage()">Send</button>

        <button
            onclick="sendMessage(true)"
            style="background-color: black; color: white; margin-left: 20px;"
        >
           Run Code
        </button>

    </div>

    <div class="code-container">
        <div id="code-block" class="code-block"></div>
    </div>


  

</div>

<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script>


window.MathJax = {
    tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
};





async function sendMessage(finalize = false) {

    let messageInput = document.getElementById("message");
    let message = messageInput.value;

    let chatbox = document.getElementById("chatbox");

    let code = document.getElementById("code-block");

    /*
     * Display user's message
     */
    chatbox.innerHTML +=
        "<b>You:</b> " +
        message +
        "<br>";


    const api_url = "{{API_URL}}";


    /*
     * Send request to backend
     */
    let response = await fetch(`${api_url}/chat`, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            student_id: "{{student_id}}",

            message: message,

           
            finalize: finalize
        })
    });
    console.log(response)

    /*
     * FINALIZE
     *
     * Backend returns Excel file
     */
     if (finalize) {

const contentType = response.headers.get("content-type");

if (contentType && contentType.includes("application/json")) {

    // Finalize failed → backend returned JSON
    const data = await response.json();

    let formatted = marked.parse(data.response);

    chatbox.innerHTML +=
        "<div><b>AI:</b>" +
        formatted +
        "</div>";
    console.log(data.code)

    // Update schedule if backend returned it
    if (data.code) {
        code.innerHTML +=
        "<p>" +
        data.code +
        "</p>";
    }

} else {

    // Finalize succeeded → backend returned Excel
    const blob = await response.blob();

    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;
    a.download = "schedule.xlsx";

    document.body.appendChild(a);

    a.click();

    a.remove();

    window.URL.revokeObjectURL(url);

    chatbox.innerHTML +=
        "<b>AI:</b> Your schedule has been downloaded ✅<br>";

        console.log(data.code)

    // Update schedule if backend returned it
    if (data.code) {
        code.innerHTML +=
        "<p>" +
        data.code +
        "</p>";
    }
}

} else {

// Normal chat response
const data = await response.json();

let formatted = marked.parse(data.response);

chatbox.innerHTML +=
    "<div><b>AI:</b>" +
    formatted +
    "</div>";
   

MathJax.typesetPromise();

// Update schedule if backend returned it
if (data.code) {
    code.innerHTML +=
    "<p>" +
    data.code +
    "</p>";
}

}

    /*
     * Clear input
     */
    messageInput.value = "";

}



</script>

</body>
</html>
